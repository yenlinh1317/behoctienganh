<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tense Quest – Chinh phục 13 thì tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{--bg:#F2F6FC;--card:#fff;--ink:#14213D;--mute:#5B6785;--line:#DCE4F2;--y:#FFC933;--g:#25C16F;--b:#2F8CFF;--r:#FF5C6C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1628;--card:#18233D;--ink:#EEF3FF;--mute:#9AA8C7;--line:#2A3858}}
:root[data-theme="dark"]{--bg:#0E1628;--card:#18233D;--ink:#EEF3FF;--mute:#9AA8C7;--line:#2A3858}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-weight:600}
#app{max-width:520px;height:100%;margin:0 auto;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:14px 16px 28px}
.screen.on{display:flex}
button{font-family:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-weight:900;font-size:22px;flex:1;letter-spacing:-.3px}
.logo i{font-style:normal;background:var(--y);color:#14213D;border-radius:10px;padding:1px 8px;margin-right:6px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:900}
.back{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:900}
h2{margin:6px 0 10px;font-size:22px;font-weight:900}
.lead{color:var(--mute);margin:0 0 14px}
.grp{position:relative;display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:24px;padding:18px;margin-bottom:12px;text-align:left;color:#14213D;overflow:hidden;box-shadow:0 6px 0 rgba(20,33,61,.22);transition:transform .1s,box-shadow .1s}
.grp:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(20,33,61,.22)}
.grp.p{background:var(--b);color:#fff}.grp.n{background:var(--g)}.grp.f{background:var(--y)}.grp.d{background:var(--ink);color:var(--bg)}
.grp .ic{font-size:50px;animation:bob 2.4s ease-in-out infinite}
.grp b{display:block;font-size:26px;font-weight:900;line-height:1.1}.grp small{font-size:15px;font-weight:700;opacity:.9}
.grp .cnt{margin-left:auto;font-size:34px;font-weight:900;opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
.tl{display:flex;align-items:center;margin:2px 0 14px}
.tl span{flex:1;text-align:center;font-size:13px;color:var(--mute)}.tl em{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;background:var(--line)}
.tl .on em{background:var(--cur);box-shadow:0 0 0 5px color-mix(in srgb,var(--cur) 25%,transparent)}.tl .on{color:var(--ink);font-weight:900}
.tcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--cur);border-radius:18px;padding:12px 14px;margin-bottom:10px;text-align:left}
.tcard:active{transform:scale(.98)}
.tcard .ic{font-size:30px}.tcard b{display:block;font-size:18px;font-weight:900}.tcard small{color:var(--mute);font-weight:700}.tcard .st{margin-left:auto;white-space:nowrap;font-size:15px}
.hero{background:var(--cur);color:#14213D;border-radius:24px;padding:16px 18px;margin-bottom:12px}
.hero.w{color:#fff}.hero small{font-weight:800;opacity:.85}.hero h1{margin:2px 0 0;font-size:26px;line-height:1.1;font-weight:900}
.tabs{display:flex;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;border-radius:12px;padding:9px;font-weight:900;font-size:16px}.tabs .on{background:var(--cur);color:#14213D}
.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:16px;font-weight:900}
.fm{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}.fm:first-of-type{border-top:0}
.fm i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff}
.fm code{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:800;word-break:break-word}
.note{color:var(--mute);font-size:14px;margin-top:6px}
.box ul{margin:0;padding-left:20px}.box li{margin:4px 0}
.sig{display:flex;flex-wrap:wrap;gap:6px}.sig span{background:color-mix(in srgb,var(--y) 35%,transparent);border-radius:999px;padding:3px 11px;font-size:14px;font-weight:800}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}.ex:first-of-type{border-top:0}
.ex button{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--b);color:#fff;font-size:18px}
.ex b{display:block}.ex small{color:var(--mute)}
.tip{background:color-mix(in srgb,var(--g) 18%,var(--card));border:2px solid var(--g);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.go{width:100%;border:0;border-radius:18px;background:var(--cur,var(--g));color:#14213D;font-size:19px;font-weight:900;padding:15px;box-shadow:0 5px 0 rgba(20,33,61,.25)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(20,33,61,.25)}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .35s}
.q{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 16px;text-align:center;margin:8px 0 14px;position:relative}
.q .lab{color:var(--mute);font-size:14px;margin-bottom:8px}.q .t{font-size:24px;font-weight:900;line-height:1.3}
.q .t u{display:inline-block;min-width:70px;border-bottom:4px solid var(--y);text-decoration:none;color:var(--b)}
.q .sp{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:12px;border:0;background:var(--b);color:#fff}
.opt{display:block;width:100%;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--card);font-size:19px;font-weight:800;padding:13px;margin-bottom:10px}
.opt:active{transform:translateY(3px);border-bottom-width:2px}
.opt.ok{background:color-mix(in srgb,var(--g) 30%,var(--card));border-color:var(--g)}.opt.no{background:color-mix(in srgb,var(--r) 25%,var(--card));border-color:var(--r)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{position:fixed;left:50%;top:38%;font-size:90px;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.pop.go2{animation:pp .9s ease-out}@keyframes pp{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-90%) scale(1.5)}}
.res{align-items:center;justify-content:center;text-align:center}.res .m{font-size:100px;animation:bob 1.8s infinite}.res .s{font-size:50px;letter-spacing:6px}
.res .go{max-width:320px;margin:6px 0}.res .go.alt{background:var(--card);border:2px solid var(--line);box-shadow:none}
.inp{width:100%;font-family:inherit;font-size:22px;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px;background:var(--card);color:var(--ink);outline:0}.inp:focus{border-color:var(--b)}
.ans{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:3px dashed var(--line);border-radius:16px;margin-bottom:12px}.ph{color:var(--mute);font-size:15px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tk{border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;background:var(--card);font-size:17px;font-weight:800;padding:8px 12px;touch-action:none;user-select:none;-webkit-user-select:none}
.dr{padding:10px 0;border-top:1px dashed var(--line)}.dr:first-child{border-top:0}.dr.ok{background:color-mix(in srgb,var(--g) 14%,transparent);border-radius:12px}
.lb{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-style:normal;font-weight:900;margin-bottom:6px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.slot{min-width:54px;min-height:40px;border:2px dashed var(--mute);border-radius:10px;padding:6px 10px;font-weight:800;font-size:16px;text-align:center}.slot.f{border:2px solid var(--g);background:color-mix(in srgb,var(--g) 25%,var(--card))}
.gh{position:fixed;transform:translate(-50%,-60%) scale(1.1);pointer-events:none;z-index:9;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px}.stats div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mute)}.stats b{display:block;font-size:17px;color:var(--ink);font-weight:900}
/* ===== MÁY TÍNH / MÀN HÌNH RỘNG (tự động theo độ rộng) ===== */
@media (min-width:860px){
 #app{max-width:1180px}
 .screen{padding:26px 40px 44px}
 .logo{font-size:28px}h2{font-size:26px}.lead{font-size:18px}
 .tcard:hover{border-color:var(--cur)}.opt:hover{border-color:var(--b)}.go:hover{filter:brightness(1.05)}
 #home.on{display:grid;grid-template-columns:repeat(3,1fr);gap:0 20px;align-content:start}
 #home .top,#home h2,#home .lead{grid-column:1/-1}
 #home .grp.d{grid-column:span 2}
 #home .grp{flex-direction:column;align-items:flex-start;justify-content:center;padding:28px;min-height:210px}
 #home .grp .ic{font-size:72px}#home .grp b{font-size:32px}
 #home .grp .cnt{position:absolute;right:22px;top:14px;margin:0}
 #list.on{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px;align-content:start}
 #list .top,#list .tl,#list .lead,#list h2,#list .hero,#list .stats,#list .note,#list .box{grid-column:1/-1}
 #lesson.on{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-content:start}
 #lesson .top,#lesson .hero,#lesson .tip,#lesson .go,#lesson .box:has(#dg){grid-column:1/-1}
 .hero h1{font-size:34px}.box{padding:18px}.fm code{font-size:16px}.ex b{font-size:18px}
 #play,#done{padding-inline:max(40px,calc((100% - 820px)/2))}
 #play.on{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-content:start}
 #play .top,#play .q,#play .go,#play .inp,#play .ans,#play .bank{grid-column:1/-1}
 .q{padding:34px 24px}.q .t{font-size:32px}.opt{font-size:21px;padding:16px}
 .stats div{font-size:14px;padding:14px 6px}.stats b{font-size:24px}
}
@media (min-width:860px) and (max-width:1100px){#home.on{grid-template-columns:repeat(2,1fr)}#home .grp.d{grid-column:span 1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
 <section class="screen on" id="home"></section>
 <section class="screen" id="list"></section>
 <section class="screen" id="lesson"></section>
 <section class="screen" id="play"></section>
 <section class="screen res" id="done"></section>
 <div class="pop" id="pop"></div>
</div>
<script>
/* ===== DỮ LIỆU 13 THÌ (nguồn: PDF + 3 file Word) ===== */
const GR={past:{n:'Quá khứ',s:'Chuyện đã xảy ra',ic:'🦖',c:'#2F8CFF',cls:'p'},pres:{n:'Hiện tại',s:'Chuyện đang xảy ra',ic:'🏃',c:'#25C16F',cls:'n'},fut:{n:'Tương lai',s:'Chuyện sắp xảy ra',ic:'🚀',c:'#FFC933',cls:'f'}};
const RAW=[
['hts','pres','Hiện tại đơn','Present Simple','☀️',['S + V(s/es) + O','S + do/does + not + V + O','Do/Does + S + V + O ?'],['Sự thật hiển nhiên','Thói quen, việc lặp lại','Năng lực, sở thích','Lịch trình cố định (tàu, xe, thời khóa biểu)'],'always, usually, often, sometimes, every day, never',[['The sun rises in the East.','Mặt trời mọc ở hướng Đông.'],['I get up early every morning.','Mình dậy sớm mỗi sáng.']],'Thêm -es sau động từ tận cùng o, s, x, ch, sh (go → goes, watch → watches).',[['Mary often ___ to school by bike.',['go','goes','is going'],1],['I ___ up early every day.',['get','gets','got'],0]],'Với to be: S + am/is/are (+ not). Hỏi: Am/Is/Are + S ?'],
['htt','pres','Hiện tại tiếp diễn','Present Continuous','🏃',['S + am/is/are + V-ing + O','S + am/is/are + not + V-ing + O','Am/Is/Are + S + V-ing + O ?'],['Hành động đang diễn ra ngay lúc nói','Sau câu mệnh lệnh: Look! Listen! Be quiet!','Phàn nàn, lặp lại với always','Kế hoạch gần trong tương lai'],'now, right now, at the moment, at present, Look!',[['The children are playing football now.','Bọn trẻ đang chơi bóng đá.'],['Look! The baby is crying.','Nhìn kìa! Em bé đang khóc.']],'KHÔNG dùng với động từ chỉ cảm giác, nhận thức: know, like, want, love, hate, understand, see, hear.',[['Be quiet! The baby ___ .',['sleeps','is sleeping','slept'],1],['They ___ football at the moment.',['play','are playing','played'],1]]],
['htht','pres','Hiện tại hoàn thành','Present Perfect','✅',['S + have/has + V3 + O','S + have/has + not + V3 + O','Have/Has + S + V3 + O ?'],['Việc đã xảy ra (hoặc chưa bao giờ) ở thời điểm không rõ trong quá khứ','Việc lặp đi lặp lại đến nay','Dùng với since và for'],'already, yet, just, ever, never, since, for, recently, before',[['I have just finished my homework.','Mình vừa làm xong bài tập.'],['She has lived here for five years.','Cô ấy sống ở đây được 5 năm.']],'since + mốc thời gian (since 2020). for + khoảng thời gian (for 5 years).',[['I have lived here ___ 2020.',['for','since','ago'],1],['He ___ already eaten.',['have','has','had'],1]]],
['hthtt','pres','Hiện tại hoàn thành tiếp diễn','Present Perfect Continuous','⏳',['S + have/has + been + V-ing + O','S + have/has + not + been + V-ing + O','Have/Has + S + been + V-ing + O ?'],['Nhấn mạnh khoảng thời gian một việc bắt đầu từ quá khứ và kéo dài đến hiện tại (có thể tiếp tục)'],'all day, all week, since, for, for a long time, lately, recently, so far, up until now',[['I have been studying English for two hours.','Mình học tiếng Anh được hai tiếng rồi.'],['It has been raining all day.','Trời mưa cả ngày rồi.']],'Hoàn thành thường: nhấn vào kết quả. Hoàn thành tiếp diễn: nhấn vào quá trình kéo dài.',[['She has been ___ since morning.',['cook','cooking','cooked'],1],['We ___ waiting for an hour.',['have been','are','had'],0]]],
['qkd','past','Quá khứ đơn','Past Simple','⏪',['S + V-ed + O','S + did + not + V + O','Did + S + V + O ?'],['Việc đã xảy ra và kết thúc ở thời điểm xác định trong quá khứ'],'yesterday, last night/week/month/year, ago, in 2020',[['I visited my grandma yesterday.','Hôm qua mình thăm bà.'],['We watched a film last night.','Tối qua tụi mình xem phim.']],'Động từ bất quy tắc phải học thuộc: go → went, eat → ate, see → saw.',[['She ___ to the zoo last week.',['goes','went','has gone'],1],['Did you ___ the game?',['win','won','winning'],0]],'Với to be: S + was/were (+ not). Hỏi: Was/Were + S ?'],
['qktt','past','Quá khứ tiếp diễn','Past Continuous','🌙',['S + was/were + V-ing + O','S + was/were + not + V-ing + O','Was/Were + S + V-ing + O ?'],['Việc đang diễn ra tại một thời điểm trong quá khứ','Việc đang diễn ra thì có việc khác xen vào','Hai việc xảy ra cùng lúc (while)'],'while, when, at that moment, at 10 pm last night',[['I was playing games at 8 last night.','8 giờ tối qua mình đang chơi game.'],['While Mom was cooking, I was reading.','Khi mẹ nấu ăn, mình đang đọc sách.']],'Việc đang diễn ra dùng tiếp diễn; việc xen vào dùng quá khứ đơn.',[['At 9 pm yesterday, I ___ TV.',['watch','was watching','watched'],1],['While she was sleeping, the phone ___ .',['rang','was ringing','rings'],0]]],
['qkht','past','Quá khứ hoàn thành','Past Perfect','📜',['S + had + V3 + O','S + had + not + V3 + O','Had + S + V3 + O ?'],['Việc xảy ra và xong TRƯỚC một việc khác trong quá khứ'],'before, after, by the time, as soon as, when, already, just',[['When I arrived, the film had started.','Khi mình đến, phim đã chiếu rồi.'],['She had eaten before I came.','Cô ấy đã ăn trước khi mình đến.']],'Việc xảy ra trước → had + V3. Việc xảy ra sau → quá khứ đơn.',[['When we got there, the bus ___ left.',['has','had','was'],1],['After he ___ homework, he played.',['finished','had finished','finishing'],1]]],
['qkhtt','past','Quá khứ hoàn thành tiếp diễn','Past Perfect Continuous','🗝️',['S + had + been + V-ing + O','S + had + not + been + V-ing + O','Had + S + been + V-ing + O ?'],['Nhấn mạnh khoảng thời gian một việc kéo dài và kết thúc trước một việc khác trong quá khứ'],'until then, by the time, prior to that time, before, after, for',[['I had been waiting for an hour when she came.','Mình đã chờ một tiếng thì cô ấy đến.'],['They had been playing until it rained.','Họ chơi mãi cho đến khi trời mưa.']],'Cách nhớ: had been + V-ing = đã đang làm (trước một mốc quá khứ).',[['He was tired because he ___ running.',['had been','has been','is'],0],['She had been ___ for two hours.',['study','studying','studied'],1]]],
['tld','fut','Tương lai đơn','Future Simple','🔮',['S + will/shall + V + O','S + will/shall + not + V + O','Will/Shall + S + V + O ?'],['Dự đoán','Quyết định ngay lúc nói, sự tình nguyện, sẵn sàng','Lời hứa, lời đề nghị'],'tomorrow, next week, soon, in the future, I think, perhaps',[['I think it will rain tomorrow.','Mình nghĩ mai trời sẽ mưa.'],['I will help you carry the bag.','Để mình giúp bạn xách túi.']],'Tình nguyện, sẵn sàng → dùng will (không dùng be going to).',[['Wait! I ___ help you.',['will','am going','helped'],0],['Tomorrow it ___ be sunny.',['will','did','has'],0]]],
['tlg','fut','Tương lai gần','Near Future','🛰️',['S + am/is/are + going to + V','S + am/is/are + not + going to + V','Am/Is/Are + S + going to + V ?'],['Dự định đã có từ trước','Dự đoán dựa vào dấu hiệu ở hiện tại'],'tonight, next month, soon, Look at the clouds!',[['I am going to visit Da Nang next month.','Tháng sau mình định đi Đà Nẵng.'],['Look at the clouds! It is going to rain.','Nhìn mây kìa! Trời sắp mưa.']],'Dự định có sẵn → be going to. Quyết định tức thì → will.',[['I saved money. I ___ to buy a new bike.',['will','am going','went'],1],['She is going ___ be a doctor.',['to','will','for'],0]]],

   const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);g.remove();
    const el=document.elementFromPoint(ev.clientX,ev.clientY),s=el&&el.closest('.slot');
    if(s)put(s);else if(Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)<10)put([...b.closest('.dr').querySelectorAll('.slot')].find(x=>!x.textContent))};
   window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)}})
}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function practice(id){
 const t=byId(id),qs=buildQs(t);
 
 run(qs,{id,title:t.vi,back:()=>lesson(id)});
}
function detective(){
 const qs=shuffle(T).slice(0,8).map(t=>{const e=shuffle(t.ex)[0];return{lab:'Thám tử: câu này thuộc thì nào?',q:e[0],o:shuffle([t.vi,...shuffle(T.filter(x=>x.id!==t.id)).slice(0,2).map(x=>x.vi)]),a:t.vi,plain:1}});
 run(qs,{id:null,title:'Thám tử thì',back:home});
}
function run(qs,cfg){S={qs,i:0,right:0,first:true,cfg,lock:false};ask()}
function ask(){
 const q=S.qs[S.i];S.lock=false;S.first=true;
 const txt=q.plain?q.q:q.q.replace('___','<u>&nbsp;&nbsp;&nbsp;</u>');
 $('play').innerHTML=`<div class="top"><button class="back" onclick="S.cfg.back()">✕</button><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><div class="chip">${S.right}✔</div></div>
 <div class="q"><div class="lab">${q.lab}</div><div class="t">${txt}</div><button class="sp" onclick="say(sentence())">🔊</button></div>
 ${body(q)||q.o.map((o,k)=>`<button class="opt" onclick="pick(this,${k})">${o}</button>`).join('')}`;
 show('play');if(q.t==='order')renderO();if(q.plain&&!q.ns)say(q.q);
}
const sentence=()=>{const q=S.qs[S.i];return q.say||(q.plain?q.q:q.q.replace('___',q.a))};
function pick(b,k){
 if(S.lock)return;const q=S.qs[S.i];
 if(q.o[k]===q.a){
  S.lock=true;b.classList.add('ok');sfx.ok();if(S.first)S.right++;
  const p=$('pop');p.textContent='⭐';p.classList.remove('go2');void p.offsetWidth;p.classList.add('go2');
  if(!q.plain||q.say)say(sentence());
  setTimeout(()=>{S.i++;S.i<S.qs.length?ask():finish()},1400);
 }else{S.first=false;b.classList.add('no','shake');sfx.no()}
}
function finish(){
 sfx.win();const n=S.right/S.qs.length,st=n>=.9?3:n>=.7?2:1;
 if(S.cfg.id){P[S.cfg.id]=Math.max(P[S.cfg.id]||0,st);save()}rec(S.cfg.id||'det',Math.round(S.right/S.qs.length*100));saveG();
 $('done').innerHTML=`<div class="m">${st===3?'🏆':st===2?'🥈':'🏅'}</div><h2>${st===3?'Xuất sắc!':st===2?'Giỏi lắm!':'Cố lên nào!'}</h2><div class="s">${stars(st)}</div><p class="lead">Đúng ngay lần đầu ${S.right}/${S.qs.length} câu – ${S.cfg.title}</p>
 <button class="go" onclick="S.cfg.id?practice('${S.cfg.id}'):detective()">Chơi lại</button><button class="go alt" onclick="S.cfg.back()">Quay về bài học</button><button class="go alt" onclick="progress()">📊 Xem tiến trình</button>`;
 show('done');
}
home();
</script>
