<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Nghiêng Đầu Chọn Đáp Án</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff3ff;--ink:#1f2a5c;--card:#fff;--a:#ff6b57;--b:#ffc93c;--c:#3dbe8b;--d:#7b61ff;--ok:#2fb344;--no:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.screen{display:none;min-height:100%;padding:16px}
.screen.on{display:flex}
#home{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#home h1{font-size:clamp(32px,6vw,60px);margin:0;line-height:1.05}
#home p{margin:0;font-size:clamp(16px,2.4vw,22px);max-width:34em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 20px;font-size:20px;font-weight:700}
.chip.sel{background:var(--ink);color:#fff}
.big{background:var(--a);color:#fff;font-size:28px;font-weight:800;padding:14px 44px;border-radius:22px;box-shadow:0 6px 0 #b8402f}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b8402f}
#msg{min-height:1.4em;font-size:18px}
#play{flex-direction:row;gap:16px;align-items:stretch}
#left{flex:0 0 34%;display:flex;flex-direction:column;gap:10px;min-width:0}
#cam{position:relative;border-radius:22px;overflow:hidden;background:#12183a;aspect-ratio:4/3;border:4px solid var(--ink)}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#camnote{position:absolute;inset:auto 0 0 0;background:rgba(18,24,58,.75);color:#fff;text-align:center;padding:4px 8px;font-size:16px;z-index:2}
#q{background:var(--card);border-radius:22px;padding:12px;text-align:center;border:4px solid var(--ink);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#q img{height:clamp(70px,16vh,150px)}
#qbig{font-size:clamp(50px,12vh,110px);font-weight:800;line-height:1}
#qtxt{font-size:clamp(18px,3vh,28px);font-weight:700}
#say{background:var(--b);border-radius:14px;padding:4px 18px;font-size:20px;font-weight:700}
#right{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
#bar{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:800}
#bar button{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-size:16px}
#opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;border-radius:22px;background:var(--card);border:5px solid var(--col);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;overflow:hidden;min-height:0}
.opt .k{position:absolute;left:8px;top:8px;width:38px;height:38px;border-radius:50%;background:var(--col);color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center}
.opt svg{height:clamp(60px,20vh,170px);max-width:100%}
.opt .pic{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:100%}.opt .pic img{height:clamp(50px,16vh,130px)}.opt .w{font-size:clamp(26px,5vh,48px);font-weight:800;line-height:1}
.opt .p{font-size:clamp(14px,2.4vh,20px);opacity:.75}
.opt .fill{position:absolute;left:0;bottom:0;height:12px;width:0;background:var(--col)}
.opt.ok{background:#d9f7de;border-color:var(--ok)}
.opt.no{background:#ffe0e0;border-color:var(--no)}
.opt.show{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.05)}}
#fb{position:fixed;inset:0;display:none;place-items:center;font-size:clamp(60px,14vw,150px);font-weight:800;pointer-events:none;z-index:9;text-shadow:0 4px 0 #fff}
#fb.on{display:grid}
#end{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
#stars{font-size:clamp(40px,8vw,80px)}
#review{max-width:640px;text-align:left;font-size:18px}
#mid{flex:1.3;display:flex;flex-direction:column;gap:10px;min-width:0;justify-content:center}
#mid #q{flex:none;flex-direction:row;flex-wrap:wrap;gap:4px 14px;padding:8px}
#mid #qbig{font-size:clamp(34px,7vh,60px)}
.side{flex:1;display:flex;min-width:0}
.side .opt{flex:1}
@media (max-width:820px),(orientation:portrait){
 #play{flex-wrap:wrap;gap:10px}
 #mid{flex:1 1 100%;order:-1}
 .side{flex:1 1 40%}
 .opt svg{height:clamp(50px,12vh,110px)}
 .opt .pic img{height:clamp(44px,12vh,100px)}
}
@media (prefers-reduced-motion:reduce){.opt.show{animation:none}}
</style>
</head>
<body>

<section id="home" class="screen on">
 <h1>Bé Nghiêng Đầu<br>Chọn Đáp Án</h1>
 <p>Bé nghe từ, chọn đáp án đúng rồi nghiêng đầu sang bên có đáp án đó.</p>
 <div class="row" id="modes"></div>
 <div class="row" id="counts"></div>
 <button class="big" id="go">Bắt đầu chơi</button>
 <div id="msg"></div>
 <p style="font-size:15px;opacity:.8">Ngồi hoặc đứng cách camera khoảng 1 m, để thấy rõ mặt và hai tai. Không có camera vẫn chơi được bằng cách bấm vào đáp án.</p>
</section>

<section id="play" class="screen">
 <div id="oL" class="side"></div>
 <div id="mid">
  <div id="bar"><span id="prog"></span><span id="score"></span><button id="quit">Thoát</button></div>
  <div id="cam"><video id="vid" playsinline muted></video><canvas id="cv"></canvas><div id="camnote">Đang bật camera…</div></div>
  <div id="q"><img id="qimg" alt=""><div id="qbig"></div><div id="qtxt"></div><button id="say">🔊 Nghe lại</button></div>
 </div>
 <div id="oR" class="side"></div>
</section>

<section id="end" class="screen">
 <div id="stars"></div>
 <h1 id="etitle" style="margin:0"></h1>
 <div id="review"></div>
 <button class="big" id="again">Chơi lại</button>
</section>
<div id="fb"></div>

com/ajax/libs/twemoji/14.0.2/72x72/1f9c3.png","au":"https://ssl.gstatic.com/dictionary/static/sounds/oxford/yogurt--_us_1.mp3"},{"l":"Y","w":"Yo-yo","vi":"Đồ chơi yo-yo","img":"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1fa80.png","au":"https://ssl.gstatic.com/dictionary/static/sounds/oxford/yo-yo--_us_1.mp3"},{"l":"Z","w":"Zebra","vi":"Con ngựa vằn","img":"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f983.png","au":"https://ssl.gstatic.com/dictionary/static/sounds/oxford/zebra--_us_1.mp3"},{"l":"Z","w":"Zero","vi":"Số 0","img":"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/0030-20e3.png","au":"https://ssl.gstatic.com/dictionary/static/sounds/oxford/zero--_us_1.mp3"},{"l":"Z","w":"Zig-zag","vi":"Đường zích-zắc","img":"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f4c8.png","au":"https://ssl.gstatic.com/dictionary/static/sounds/oxford/zigzag--_us_1.mp3"},{"l":"Z","w":"Zipper","vi":"Khóa kéo (phéc-mơ-tuya)","img":"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f962.png","au":"https://ssl.gstatic.com/dictionary/static/sounds/oxford/zipper--_us_1.mp3"},{"l":"Z","w":"Zoo","vi":"Vườn bách thú","img":"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f3e1.png","au":"https://ssl.gstatic.com/dictionary/static/sounds/oxford/zoo--_us_1.mp3"},{"l":"Z","w":"Zucchini","vi":"Bí ngòi","img":"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f952.png","au":"https://ssl.gstatic.com/dictionary/static/sounds/oxford/zucchini--_us_1.mp3"}]};
</script>
<script type="module">
import {PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);
const COLS=['--a','--b','--c','--d'], KEYS='ABCD', HOLD=1.0;

/* ---- Nghiêng đầu: L = trái, R = phải (theo hình gương trên màn hình) ---- */
const TILT={L:'Nghiêng đầu sang trái',R:'Nghiêng đầu sang phải'};
function poseSVG(side,col){
 const a=side==='L'?-26:26;
 return `<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M20 118Q60 82 100 118Z" fill="${col}"/><g transform="rotate(${a} 60 90)"><circle cx="60" cy="52" r="30" fill="#ffd9b3" stroke="#1f2a5c" stroke-width="3"/><circle cx="50" cy="48" r="3.5" fill="#1f2a5c"/><circle cx="70" cy="48" r="3.5" fill="#1f2a5c"/><path d="M48 62q12 10 24 0" stroke="#1f2a5c" stroke-width="3" fill="none" stroke-linecap="round"/></g></svg>`;
}
const TH=14;
function tilt(lm){
 const a=lm[7],b=lm[8];
 if(!a||!b||(a.visibility??1)<.4||(b.visibility??1)<.4)return null;
 const ang=Math.atan2(a.y-b.y,a.x-b.x)*180/Math.PI;
 return ang>TH?'R':ang<-TH?'L':null;
}

/* ---- Âm thanh ---- */
let AC; const beep=(f,d=.15,ty='sine',t0=0)=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.18,AC.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d)}catch(e){}};
const sfx={ok:()=>[523,659,784].forEach((f,i)=>beep(f,.18,'triangle',i*.12)),no:()=>{beep(220,.25,'sawtooth');beep(180,.3,'sawtooth',.2)},tick:()=>beep(880,.05)};
let curAudio;
function speak(text,url){
 try{curAudio&&curAudio.pause()}catch(e){}
 const fb=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
 if(!url)return fb();
 curAudio=new Audio(url);curAudio.onerror=fb;curAudio.play().catch(fb);
}

/* ---- Trạng thái game ---- */
let mode='all',total=10,qs=[],qi=0,score=0,locked=true,cand=null,held=0,lastT=0,wrongs=[],camOK=false,landmarker=null,running=false;
const modes=[['all','Chữ cái + Từ vựng'],['words','Từ vựng'],['letters','Chữ cái']],counts=[5,10,20];
const mk=(box,items,get,set,cur)=>{box.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.className='chip'+(get(it)===cur?' sel':'');b.textContent=Array.isArray(it)?it[1]:it+' câu';b.onclick=()=>{set(it);[...box.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel')};box.appendChild(b)})};
mk($('modes'),modes,i=>i[0],i=>mode=i[0],'all');
mk($('counts'),counts,i=>i,i=>total=i,10);

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function buildQs(){
 const pool=[];
 if(mode!=='letters')shuffle(DATA.words).forEach(w=>pool.push({t:'w',v:w}));
 if(mode!=='words')shuffle(DATA.letters).forEach(l=>pool.push({t:'l',v:l}));
 let picked=mode==='all'?shuffle([...shuffle(pool.filter(x=>x.t==='w')).slice(0,Math.ceil(total*.6)),...shuffle(pool.filter(x=>x.t==='l')).slice(0,Math.floor(total*.4))]):shuffle(pool).slice(0,total);
 return picked.slice(0,total).map(q=>{
  let right,wrong;
  if(q.t==='w'){right={t:q.v.w,img:q.v.img};const seen=new Set([right.t.toLowerCase()]);wrong=[];for(const o of shuffle(DATA.words)){const k=o.w.toLowerCase();if(!seen.has(k)){seen.add(k);wrong.push({t:o.w,img:o.img});if(wrong.length===1)break}}}
  else{right={t:q.v.c+' '+q.v.l,img:q.v.img};wrong=shuffle(DATA.letters.filter(x=>x!==q.v)).slice(0,1).map(x=>({t:x.c+' '+x.l,img:x.img}))}
  const texts=shuffle([right,...wrong]),pp=shuffle(['L','R']);
  return {q,right:right.t,opts:texts.map((t,i)=>({t:t.t,img:t.img,pose:pp[i]}))};
 });
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

async function startCam(){
 $('camnote').textContent='Đang bật camera…';
 try{
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
  $('vid').srcObject=st;await $('vid').play();
 }catch(e){camOK=false;$('camnote').textContent='Không có camera: bấm vào đáp án để chọn';return}
 camOK=true;$('camnote').textContent='Đang tải bộ nhận diện (lần đầu hơi lâu)…';
 try{
  if(!landmarker){
   const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
   const opt=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:1});
   try{landmarker=await PoseLandmarker.createFromOptions(fs,opt('GPU'))}catch(e){landmarker=await PoseLandmarker.createFromOptions(fs,opt('CPU'))}
  }
  $('camnote').textContent='Nghiêng đầu sang bên đáp án bé chọn và giữ yên 1 giây';
 }catch(e){landmarker=null;$('camnote').textContent='Không tải được bộ nhận diện (cần Internet): bấm vào đáp án để chọn'}
}

function showQ(){
 const Q=qs[qi];locked=false;cand=null;held=0;
 $('prog').textContent=`Câu ${qi+1}/${qs.length}`;$('score').textContent=`⭐ ${score}`;
 const img=$('qimg'),big=$('qbig');
 img.style.display='none';big.textContent='🔊';$('qtxt').textContent='Nghe và chọn đáp án đúng';
 Q.q.t==='w'?speak(Q.q.v.w,Q.q.v.au):speak(Q.q.v.c)
 $('oL').innerHTML='';$('oR').innerHTML='';
 Q.opts.forEach((o,i)=>{
  const d=document.createElement('button');d.className='opt';d.style.setProperty('--col',`var(${COLS[i]})`);
  d.innerHTML=`<span class="k">${KEYS[i]}</span><div class="pic"><img src="${o.img}" alt=""><span class="w">${o.t}</span></div>${poseSVG(o.pose,getComputedStyle(document.documentElement).getPropertyValue(COLS[i]).trim())}<span class="p">${o.pose==='L'?'⬅ ':''}${TILT[o.pose]}${o.pose==='R'?' ➡':''}</span><span class="fill"></span>`;
  d.onclick=()=>answer(i);$(i?'oR':'oL').appendChild(d);
 });
}

function answer(i){
 if(locked)return;locked=true;
 const Q=qs[qi],ok=Q.opts[i].t===Q.right,els=[...$('oL').children,...$('oR').children];
 els[i].classList.add(ok?'ok':'no');
 if(ok){score++;sfx.ok();flash('🎉 Giỏi quá!')}
 else{wrongs.push(Q);sfx.no();const r=Q.opts.findIndex(o=>o.t===Q.right);els[r].classList.add('ok','show');flash('Chưa đúng, thử lại sau nhé!')}
 $('score').textContent=`⭐ ${score}`;
 setTimeout(()=>{qi++;qi<qs.length?showQ():finish()},ok?1500:2600);
}
function flash(t){const f=$('fb');f.textContent=t;f.classList.add('on');setTimeout(()=>f.classList.remove('on'),1100)}

function finish(){
 running=false;const st=$('vid').srcObject;if(st)st.getTracks().forEach(t=>t.stop());$('vid').srcObject=null;
 const r=score/qs.length,n=r>=.9?3:r>=.6?2:1;
 $('stars').textContent='⭐'.repeat(n)+'☆'.repeat(3-n);
 $('etitle').textContent=`Bé đúng ${score}/${qs.length} câu`;
 $('review').innerHTML=wrongs.length?'<b>Cần ôn lại:</b> '+[...new Set(wrongs.map(q=>q.right))].join(', '):'Tuyệt vời, bé đúng hết!';
 show('end');
}

/* ---- Vòng lặp nhận diện ---- */
function loop(now){
 if(!running)return;requestAnimationFrame(loop);
 const v=$('vid'),dt=Math.min((now-lastT)/1000,.2);lastT=now;
 if(!camOK||!landmarker||v.readyState<2||locked)return;
 const cv=$('cv'),c=cv.getContext('2d');
 if(cv.width!==v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight}
 const res=landmarker.detectForVideo(v,now);c.clearRect(0,0,cv.width,cv.height);
 const lm=res.landmarks&&res.landmarks[0];
 const Q=qs[qi],allowed=Q.opts.map(o=>o.pose);
 const els=[...$('oL').children,...$('oR').children];
 let p=null;
 if(lm){
  p=tilt(lm);
  c.strokeStyle='#ffc93c';c.lineWidth=6;c.lineCap='round';c.fillStyle='#fff';
  [[7,8]].forEach(([a,b])=>{c.beginPath();c.moveTo(lm[a].x*cv.width,lm[a].y*cv.height);c.lineTo(lm[b].x*cv.width,lm[b].y*cv.height);c.stroke()});
  [0,7,8].forEach(i=>{c.beginPath();c.arc(lm[i].x*cv.width,lm[i].y*cv.height,7,0,7);c.fill()});
 }
 if(p&&p===cand)held+=dt;else{cand=p;held=0}
 els.forEach((e,i)=>e.querySelector('.fill').style.width=(p&&Q.opts[i].pose===cand?Math.min(held/HOLD,1)*100:0)+'%');
 if(cand&&held>=HOLD){const i=allowed.indexOf(cand);cand=null;held=0;if(i>=0)answer(i)}
}

/* ---- Điều khiển ---- */
$('go').onclick=async()=>{
 beep(660,.1);$('msg').textContent='';qs=buildQs();qi=0;score=0;wrongs=[];show('play');
 const sv=startCam();showQ();running=true;lastT=performance.now();requestAnimationFrame(loop);await sv;
};
$('again').onclick=()=>show('home');
$('quit').onclick=()=>{running=false;const st=$('vid').srcObject;if(st)st.getTracks().forEach(t=>t.stop());show('home')};
$('say').onclick=()=>{const Q=qs[qi];Q.q.t==='w'?speak(Q.q.v.w,Q.q.v.au):speak(Q.q.v.c)};
addEventListener('keydown',e=>{const i=KEYS.indexOf(e.key.toUpperCase());if(i>=0&&$('play').classList.contains('on'))answer(i)});
</script>
</body>
</html>
