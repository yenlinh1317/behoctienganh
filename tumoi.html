function go(i){last=i;const k=G[i][2];k=='flash'?flash():k=='match'?match():k=='race'?race():quiz(k)}
let AC;const au=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();return AC}catch(e){}};
function clap(){const c=au();if(!c)return;const r=c.sampleRate,b=c.createBuffer(1,r*2.5,r),d=b.getChannelData(0);for(let k=0;k<70;k++){const s=(Math.random()*1.9*r)|0,a=.3+Math.random()*.5;for(let i=0;i<r*.06&&s+i<d.length;i++)d[s+i]+=(Math.random()*2-1)*a*Math.exp(-i/(r*.012))}const o=c.createBufferSource();o.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;const g=c.createGain();g.gain.value=3;const k=c.createDynamicsCompressor();o.connect(f);f.connect(g);g.connect(k);k.connect(c.destination);o.start()}
function tone(fr,t0,l,ty,v){const c=au();if(!c)return;const o=c.createOscillator(),g=c.createGain(),T=c.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(fr[0],T);o.frequency.exponentialRampToValueAtTime(fr[1],T+l);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+l);o.connect(g);g.connect(c.destination);o.start(T);o.stop(T+l)}
const ding=()=>{tone([660,660],0,.4,'sine',.3);tone([880,880],.2,.5,'sine',.3)};
const eck=()=>{tone([1000,600],0,.22,'triangle',.5);tone([600,200],.3,.4,'triangle',.5)};
function fw(){const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9';document.body.append(cv);const x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;let P=[],t0=Date.now(),last=-999;
const burst=()=>{tone([400,50],0,.25,'sine',.5);const cx=cv.width*(.15+Math.random()*.7),cy=cv.height*(.12+Math.random()*.4),h=Math.random()*360;for(let i=0;i<60;i++){const a=Math.PI*2*i/60,s=2+Math.random()*4;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h})}};
const f=()=>{const n=Date.now()-t0;x.clearRect(0,0,cv.width,cv.height);if(n<3500&&n-last>450){last=n;burst()}P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.012;x.fillStyle=`hsla(${p.h},100%,55%,${p.l})`;x.beginPath();x.arc(p.x,p.y,2.5,0,7);x.fill()});if(n<3500||P.length)requestAnimationFrame(f);else cv.remove()};f()}
function end(sc,t){if(t==10)(sc>=9?clap:sc==8?ding:eck)();if(t==10&&sc>=9)fw();A.innerHTML=`<div class=big>${t!=10?'⏱️':sc>=9?'🏆👏':sc==8?'😊':'😅'}</div><h2>${sc}/${t}</h2><p>+${sc} điểm · ⭐ ${bal()} sao</p><div class=row><button onclick=go(last)>Chơi lại</button><button onclick=home()>Menu</button></div>`}
function flash(){let L=S(W),i=0,f=0;const draw=()=>{const w=L[i];A.innerHTML=`<div class=top><button onclick=home()>←</button><span>${i+1}/${L.length}</span></div><div class=card id=cd>${f?`<h2>${w.v}</h2><p>${w.p}</p>`:`<h2>${w.e}</h2><p>Chạm để lật</p>`}</div><div class=row><button id=pv>◀</button><button id=sp>🔊</button><button id=nx>▶</button></div>`;
$('#pv').onclick=()=>{i=(i+L.length-1)%L.length;f=0;draw()};$('#nx').onclick=()=>{i=(i+1)%L.length;f=0;draw()};$('#sp').onclick=()=>say(w.e);$('#cd').onclick=()=>{f=!f;draw()}};draw()}
function match(){const P=S(W).slice(0,6);let T=S(P.flatMap(w=>[{w,t:w.e},{w,t:w.v}])),sel=null,ok=0;
A.innerHTML=`<div class=top><button onclick=home()>←</button><span>Ghép từ với nghĩa</span></div><div class=tiles id=t></div>`;
T.forEach(x=>{const b=document.createElement('button');b.textContent=x.t;b.onclick=()=>{if(b.disabled)return;if(x.t==x.w.e)say(x.w.e);if(!sel){sel={x,b};b.classList.add('ok');return}
if(sel.b==b)return;if(sel.x.w==x.w&&sel.x.t!=x.t){b.classList.add('ok');b.disabled=sel.b.disabled=true;if(++ok==6)setTimeout(()=>end(6,6,'m'),600)}else{b.classList.add('no');const s=sel.b;setTimeout(()=>{b.classList.remove('no');s.classList.remove('ok')},500)}sel=null};$('#t').append(b)})}
function quiz(k){let n=0,sc=0;const Q=S(W.filter(w=>!/\s/.test(w.e))).slice(0,10);const nx=()=>{if(n>=10)return end(sc,10);ask(k,Q[n],ok=>{if(ok)sc++;n++;setTimeout(nx,0)},`${n+1}/10`)};nx()}
let tm;function race(){let sc=0,t=60,on=1;clearInterval(tm);tm=setInterval(()=>{t--;const e=$('#tt');if(e)e.textContent='⏱ '+t;if(t<=0){clearInterval(tm);on=0;end(sc,sc,'race')}},1000);
const nx=()=>{if(on)ask('race',R(W.filter(w=>!/\s/.test(w.e))),ok=>{if(ok)sc++;setTimeout(nx,0)},`<span id=tt>⏱ ${t}</span> · ✔ ${sc}`)};nx()}
function ask(k,w,cb,info){A.innerHTML=`<div class=top><button onclick="clearInterval(tm);home()">←</button><span>${info}</span></div><div id=q></div><div id=o class=o></div>`;
const q=$('#q'),o=$('#o');let d=0;const fin=(ok,el)=>{if(d)return;d=1;if(el)el.classList.add(ok?'ok':'no');q.insertAdjacentHTML('beforeend',`<p class=f>${ok?'🎉 Đúng!':'😅 Đáp án'}: <b>${w.e}</b> ${w.p} = ${w.v}</p>`);say(w.e);{const b=document.createElement('button');b.textContent='Tiếp theo →';b.className='ok';b.onclick=()=>cb(ok);o.append(b)}};
const mk=(txt,fn,box=o)=>{const b=document.createElement('button');b.textContent=txt;b.onclick=()=>fn(b);box.append(b);return b};
const four=()=>S([w,...S(W.filter(x=>x!=w)).slice(0,3)]);
if(k=='race')k=R(['mc1','mc2','ls']);
if(k=='mc1'){q.innerHTML=`<h2>${w.e}</h2><p>${w.p}</p>`;say(w.e);four().forEach(x=>mk(x.v,b=>fin(x==w,b)))}
else if(k=='mc2'){q.innerHTML=`<h2>${w.v}</h2>`;four().forEach(x=>mk(x.e,b=>fin(x==w,b)))}
else if(k=='ls'){q.innerHTML=`<h2>🔊 Nghe và chọn</h2>`;say(w.e);mk('🔊 Nghe lại',()=>say(w.e));four().forEach(x=>mk(x.e,b=>fin(x==w,b)))}
else if(k=='miss'){const i=R([...w.e].map((c,j)=>j).filter(j=>j>0));const c=w.e[i];q.innerHTML=`<h2>${w.e.slice(0,i)}_${w.e.slice(i+1)}</h2><p>${w.v} · ${w.p}</p>`;const ls=[c];while(ls.length<4){const x=R([...'abcdefghilmnoprstuy']);if(!ls.includes(x))ls.push(x)}o.className='o two';S(ls).forEach(x=>mk(x,b=>fin(x==c,b)))}
else if(k=='scr'){q.innerHTML=`<p>${w.v}</p><h2 id=s>&nbsp;</h2>`;let s='';o.className='o two';S([...w.e]).forEach(c=>mk(c,b=>{b.disabled=true;s+=c;$('#s').textContent=s;if(s.length==w.e.length)fin(s==w.e)}))}
else if(k=='type'){q.innerHTML=`<h2>${w.v}</h2><p>Gõ từ tiếng Anh</p>`;say(w.e);mk('🔊 Nghe',()=>say(w.e));const i=document.createElement('input');i.autocapitalize='off';o.append(i);mk('Kiểm tra',()=>fin(i.value.trim().toLowerCase()==w.e))}
else if(k=='tf'){const r=Math.random()<.5,s=r?w:R(W.filter(x=>x!=w));q.innerHTML=`<h2>${w.e}</h2><p>có nghĩa là</p><h2>${s.v}</h2>`;say(w.e);o.className='o two';mk('✅ Đúng',b=>fin(r,b));mk('❌ Sai',b=>fin(!r,b))}}
home();
</script></body></html>
