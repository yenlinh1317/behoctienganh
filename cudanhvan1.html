function home(){stopCam();G=null;const done=Object.keys(S.s).filter(k=>S.s[k]>0);
$.innerHTML=`<h1>🦉 Cú Con Đánh Vần</h1><p class="sub">Theo sách “Luyện Đọc” tập 1 · Bài 1–26</p>
<div class="bar" style="justify-content:center;gap:8px;flex-wrap:wrap"><button class="ghost" style="${M==0?'outline:3px solid var(--pri)':''}" onclick="M=0;home()">🎮 Chơi game</button><button class="ghost" style="${M==1?'outline:3px solid var(--pri)':''}" onclick="M=1;home()">📖 Tập đọc câu</button><button class="ghost" style="${M==2?'outline:3px solid var(--pri)':''}" onclick="M=2;home()">🙌 Giơ tay</button></div><div class="garden">${done.length?done.map(k=>AN[k]).join(" "):"Hoàn thành bài để nhận bạn thú vào vườn!"}</div>
<div class="grid">${(M==1?R:L).map((l,i)=>`<button class="cell" onclick="go(${i})"><small>Bài ${i+1}</small><b>${i<26?L[i][0]:"📖"}</b><span>${"⭐".repeat(S.s[i]||0)||"·"}</span></button>`).join("")}</div>`}

function start(i){G={i,w:shuf(L[i][2].split(",")),r:0,m:0};nextRound()}
const bar=()=>`<div class="bar"><button class="ghost" onclick="home()">←</button><div class="dots">${G.w.map((_,k)=>`<i class="${k<G.r?"on":""}"></i>`).join("")}</div><div>Bài ${G.i+1}</div></div>`;

function nextRound(){
 if(G.r>=G.w.length)return finish();
 const w=G.w[G.r];
 if(G.r%2==0){ // Ghép tiếng
  G.syl=w.split(" ").map(sp);G.built=G.syl.map(s=>[s[0]?"":"-",""]);
  G.steps=[];G.syl.forEach((s,t)=>{if(s[0])G.steps.push([t,0]);G.steps.push([t,1])});G.k=0;drawA();
 }else drawB();
}
function drawA(){
 const w=G.w[G.r],st=G.steps[G.k],[t,kind]=st||[],s=G.syl[t]||[];
 const pool=kind?[...new Set(G.syl.flatMap(()=>L[G.i][2].split(/[, ]/)).map(x=>sp(x)[1]))]:[...new Set(L[G.i][2].split(/[, ]/).map(x=>sp(x)[0]).filter(Boolean))];
 const fb=kind?["a","o","ô","ơ","u","ư","i","ê","e"]:["b","c","m","n","t","h","l"];
 let o=[s[kind]];[...shuf(pool),...shuf(fb)].forEach(x=>{if(o.length<3&&!o.includes(x))o.push(x)});o=shuf(o);
 const box=G.built.map(b=>`<div class="syl"><span class="on">${b[0]==="-"?"":b[0]||"▢"}</span><span class="van">${b[1]||"▢"}</span></div>`).join("");
 $.innerHTML=bar()+`<button class="say" onclick="say('${w}')">🔊</button><div class="word">${box}</div>
 <div class="q">Ghép từ “${w}”<br>${kind?"Vần":"Âm đầu"} của tiếng “${w.split(" ")[t]}” là gì?</div>
 <div class="opts">${o.map(x=>`<button class="opt" onclick="pickA(this,'${x}')">${x}</button>`).join("")}</div>`;
 if(G.k==0)say(w);
}
function pickA(b,x){
 const [t,kind]=G.steps[G.k];
 if(x!==G.syl[t][kind]){no();G.m++;b.classList.add("bad");return}
 ok();b.classList.add("good");G.built[t][kind]=x;
 const done=G.built[t][0]&&G.built[t][1];
 G.k++;
 if(G.k>=G.steps.length){drawA2();setTimeout(()=>{say(G.w[G.r]);G.r++;setTimeout(nextRound,1400)},500)}
 else setTimeout(()=>{if(done)say(G.w[G.r].split(" ")[t]);drawA()},350);
}
function drawA2(){const w=G.w[G.r];$.innerHTML=bar()+`<div class="word">${G.built.map(b=>`<div class="syl"><span class="on">${b[0]==="-"?"":b[0]}</span><span class="van">${b[1]}</span></div>`).join("")}</div><div class="q">🎉 Giỏi quá! “${w}”</div>`}

function drawB(){
 const w=G.w[G.r],tts="speechSynthesis"in window;
 const o=shuf([w,...shuf(G.w.filter(x=>x!==w)).slice(0,2)]);
 $.innerHTML=bar()+`<div class="q">${tts?"Nghe Cú đọc, bấm vào từ đúng nhé!":"Tìm từ “"+w+"”"}</div><button class="say" onclick="say('${w}')">🔊</button>
 <div class="opts w">${o.map(x=>`<button class="opt" onclick="pickB(this,'${x}')">${x}</button>`).join("")}</div>`;
 say(w);
}
function pickB(b,x){
 if(x!==G.w[G.r]){no();G.m++;b.classList.add("bad");b.disabled=true;return}
 ok();b.classList.add("good");G.r++;setTimeout(nextRound,800);
}
function finish(){stopCam();
 const n=G.m==0?3:G.m<=3?2:1;S.s[G.i]=Math.max(S.s[G.i]||0,n);save();
 $.innerHTML=`<h1>Hoàn thành Bài ${G.i+1}!</h1><div class="big">${AN[G.i]}</div><p class="sub">Bạn nhỏ nhận được thú cưng mới</p><div style="font-size:2.4rem">${"⭐".repeat(n)}</div>
 <button class="btn" onclick="go(${G.i})">Chơi lại</button>${G.i<(M==1?R:L).length-1?`<button class="btn" onclick="go(${G.i+1})">Bài tiếp →</button>`:""}<button class="btn" onclick="home()">Về bản đồ</button>`;
 ok();say("Giỏi quá!");
}
const go=i=>M==2?startH(i):M?startR(i):start(i);
const clean=s=>s.replace(/[.,:!?…“”"]/g,"");
const norm=s=>clean(s.toLowerCase().normalize("NFC")).split(/\s+/).filter(Boolean);
function startR(i){G={i,w:R[i],r:0,m:0,sp:{}};drawR()}
function drawR(){
 if(G.r>=G.w.length)return finish();
 const s=G.w[G.r];G.sp={};
 $.innerHTML=bar()+`<div class="q">① Bấm từng từ để đánh vần<br>② Bấm 🎤 rồi đọc cả câu</div>
 <div class="word" style="font-size:1.9rem;gap:8px">${s.split(" ").map((w,k)=>`<div class="syl" id="w${k}" style="min-width:0" onclick="spell(${k})">${w}</div>`).join("")}</div>
 <div id="sp" class="q" style="min-height:3em;font-size:1.6rem"></div>
 <button class="say" onclick="say('${s}')">🔊</button> <button class="say" style="background:var(--bad)" onclick="listen()">🎤</button>
 <div><button class="btn" onclick="G.m++;G.r++;drawR()">Câu tiếp →</button></div>
 <div id="fb" class="q"></div>`;
}
function spell(k){
 const w=clean(G.w[G.r].split(" ")[k]),[o,v]=sp(w.toLowerCase());
 document.getElementById("w"+k).classList.add("seen");
 document.getElementById("sp").innerHTML=`${o?`<span class="on">${o}</span> + `:""}<span class="van">${v}</span> → <b>${w}</b>`;
 say(w);
}
function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,fb=document.getElementById("fb");
 if(!SR){fb.innerHTML=`Máy chưa hỗ trợ nghe giọng. Bố mẹ nghe bé đọc rồi chọn nhé:<br><button class="btn" onclick="judge(1)">✅ Đọc đúng</button><button class="btn" onclick="judge(0)">🔁 Đọc lại</button>`;return}
 const r=new SR();r.lang="vi-VN";r.interimResults=false;r.maxAlternatives=3;
 fb.textContent="🎧 Cú đang nghe… bé đọc đi nào!";
 r.onresult=e=>check([...e.results[0]].map(a=>a.transcript));
 r.onerror=()=>{fb.textContent="Cú chưa nghe rõ. Bé cho phép micro rồi bấm 🎤 thử lại nhé."};
 try{r.start()}catch(e){}
}
function lcs(t,h){const n=t.length,m=h.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=t[i]==h[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
 const f=Array(n).fill(0);let i=0,j=0;while(i<n&&j<m){if(t[i]==h[j]){f[i]=1;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return f}
function check(alts){
 const t=norm(G.w[G.r]);let best=null,heard=alts[0];
 alts.forEach(a=>{const f=lcs(t,norm(a));if(!best||f.reduce((x,y)=>x+y)>best.reduce((x,y)=>x+y)){best=f;heard=a}});
 t.forEach((_,k)=>{const e=document.getElementById("w"+k);e.classList.remove("okc","badc");e.classList.add(best[k]?"okc":"badc")});
 const miss=best.filter(x=>!x).length,fb=document.getElementById("fb");
 const pass=miss==0||(t.length>=6&&miss==1);
 fb.innerHTML=`Cú nghe được: “${heard}”<br>`+(pass?"🎉 Đọc chính xác rồi!":"Chưa đúng ở các từ màu đỏ. Bấm vào từ đỏ để đánh vần lại, rồi bấm 🎤 đọc lại nhé!");
 if(pass){ok();say(G.w[G.r]);G.r++;setTimeout(drawR,2200)}else{no();G.m++}
}
function judge(v){if(v){ok();G.r++;drawR()}else{G.m++;document.getElementById("fb").textContent="Bé đánh vần lại rồi đọc tiếp nhé!"}}
let cam=null,raf=0,bg=null,last=0;
const cv=document.createElement("canvas");cv.width=48;cv.height=36;
const cx=cv.getContext("2d",{willReadFrequently:true});
function stopCam(){cancelAnimationFrame(raf);if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}bg=null}
function startH(i){G={i,w:shuf(L[i][2].split(",")),r:0,m:0,h:1};drawH()}
async function drawH(){
 if(!G||!G.h)return;
 if(G.r>=G.w.length)return finish();
 const w=G.w[G.r],o=shuf([w,...shuf(G.w.filter(x=>x!==w)).slice(0,2)]);
 G.o=o;G.lock=0;G.hold=[0,0,0];G.dead=[0,0,0];
 $.innerHTML=bar()+`<div class="q">Cú đọc từ nào? Giơ tay vào ô đáp án nhé! <button class="say" style="width:64px;height:64px;font-size:1.8rem;vertical-align:middle" onclick="say('${w}')">🔊</button></div>
 <div class="cam"><video id="v" playsinline muted></video><div class="zones">${o.map((x,k)=>`<div class="zone" id="z${k}" onclick="pickH(${k})"><b>${x}</b><i id="p${k}"></i></div>`).join("")}</div></div>
 <div id="cm" class="q" style="font-size:1.1rem">Ngồi yên, chỉ giơ và vẫy tay vào ô muốn chọn (khoảng 1 giây). Cũng có thể bấm thẳng vào ô.</div>`;
 say(w);
 if(!cam){try{cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480}})}catch(e){const c=document.getElementById("cm");if(c)c.textContent="Chưa mở được camera. Bé bấm thẳng vào ô đáp án, hoặc cho phép camera rồi mở lại trang nhé."}}
 if(!G||!G.h){stopCam();return}
 if(cam){const v=document.getElementById("v");if(!v)return;v.srcObject=cam;try{await v.play()}catch(e){}cancelAnimationFrame(raf);loop(v)}
}
function loop(v){
 raf=requestAnimationFrame(()=>loop(v));
 if(!G||!G.h||G.lock||v.readyState<2)return;
 const now=performance.now(),dt=Math.min(now-last,100);last=now;
 cx.save();cx.scale(-1,1);cx.drawImage(v,-48,0,48,36);cx.restore();
 const d=cx.getImageData(0,0,48,36).data,n=48*36;
 if(!bg){bg=new Float32Array(n);for(let p=0;p<n;p++)bg[p]=d[p*4]*.3+d[p*4+1]*.59+d[p*4+2]*.11;return}
 const cnt=[0,0,0];
 for(let y=0;y<36;y++)for(let x=0;x<48;x++){const p=y*48+x,g=d[p*4]*.3+d[p*4+1]*.59+d[p*4+2]*.11;if(Math.abs(g-bg[p])>30)cnt[Math.min(2,x/16|0)]++;bg[p]+=(g-bg[p])*.04}
 const fr=cnt.map(c=>c/(16*36)),m=fr.indexOf(Math.max(...fr));
 for(let k=0;k<3;k++){
  const act=k==m&&fr[k]>.12&&!G.dead[k];
  G.hold[k]=act?G.hold[k]+dt:Math.max(0,G.hold[k]-dt*2);
  const e=document.getElementById("p"+k);if(e)e.style.width=Math.min(100,G.hold[k]/12)+"%";
  if(G.hold[k]>=1200){pickH(k);break}
 }
}
function pickH(k){
 if(!G||G.lock||G.dead[k])return;
 const x=G.o[k],z=document.getElementById("z"+k);
 if(x!==G.w[G.r]){no();G.m++;G.dead[k]=1;G.hold=[0,0,0];z.classList.add("bad");return}
 G.lock=1;ok();z.classList.add("good");say(x);G.r++;setTimeout(drawH,1300);
}
home();
</script></body></html>
